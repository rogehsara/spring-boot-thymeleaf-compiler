<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Product Details</title>
    <style>
        #details {
            width: 60%;
            margin: 0 auto;
            text-align: center;
        }
        #details img {
            max-width: 300px;
        }
        .price {
            color: #c00;
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="details">
    <img th:src="@{${product.imageUrl}}" alt="product image"/>
    <h1 th:text="${product.name}">Name</h1>
    <p class="price" th:text="${product.price} + ' $'">0 $</p>
    <p th:text="${product.details}">Details</p>
    <p th:if="${product.price > 1000}">Expensive product</p>
    <p th:unless="${product.price > 1000}">Good price</p>
    <br>
    <a th:href="@{/products}">Back to products</a>
</div>
</body>
</html>
