<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <style>
        form {
            width: 400px;
            margin: 20px auto;
        }
        label, input, textarea {
            display: block;
            width: 100%;
            margin-bottom: 8px;
        }
        button {
            background: #28a745;
            color: white;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
<h1>Add New Product</h1>

<form th:action="@{/products/add}" th:object="${product}" method="post">
    <label>Name</label>
    <input type="text" th:field="*{name}" required>

    <label>Price</label>
    <input type="number" step="0.01" th:field="*{price}" required>

    <label>Image URL</label>
    <input type="text" th:field="*{imageUrl}">

    <label>Details</label>
    <textarea th:field="*{details}" rows="4"></textarea>

    <button type="submit">Save</button>
</form>

<a th:href="@{/products}">Back to products</a>
</body>
</html>
